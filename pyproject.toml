[project]
name = "us-medical-insurance-costs"
version = "1.0.0"
description = "Analyse U.S. medical insurance costs by region, BMI, and smoking status"
requires-python = ">=3.10"
dependencies = [
    "pandas>=1.5",
    "matplotlib>=3.6",
    "seaborn>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "nbconvert>=7.0",
    "ipykernel>=6.0",
    "pre-commit>=3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"
